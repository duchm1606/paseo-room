# Codex Peer (Zen direct) — Paseo provider "codex-peer-zen".
# Same seat as "peer" (instructions inherited via room_instructions_from),
# reached over a different transport. CLIProxyAPI 7.2.120 drops the SSE
# terminator events for gpt-5.6-luna, so Codex never finalises an item and the
# seat announces a tool call it never runs; codex-room sends this role straight
# to OpenCode Zen instead. The role exists only to carry that one model.
# Remove this overlay together with the rest of the bypass once CLIProxyAPI is
# fixed. Luna peers always run max thinking (owner rule 2026-08-10).

model = "gpt-5.6-luna"
model_reasoning_effort = "max"
model_reasoning_summary = "none"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
room_instructions_from = "peer"
